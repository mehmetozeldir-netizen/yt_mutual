name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Generate Android project and configure Firebase
        shell: bash
        run: |
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json "$RUNNER_TEMP/google-services.json"
          fi
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            rm -rf android
            flutter create . --platforms=android --org com.mycompany --project-name ytmutual
          fi
          if [ -f "$RUNNER_TEMP/google-services.json" ]; then
            mkdir -p android/app
            cp "$RUNNER_TEMP/google-services.json" android/app/google-services.json
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path("android/app/build.gradle")
          settings_path = Path("android/settings.gradle")
          if not app_path.exists() or not settings_path.exists():
              raise SystemExit("Expected Groovy Gradle files were not generated.")

          app = app_path.read_text()
          settings = settings_path.read_text()

          def replace_line(pattern, replacement, source, label):
              updated, count = re.subn(pattern, replacement, source, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f"Could not safely configure {label}; matched {count} lines.")
              return updated

          app = replace_line(r'^\s*compileSdk(?:Version)?\s+.*$', '    compileSdkVersion 35', app, 'compileSdk')
          app = replace_line(r'^\s*minSdk(?:Version)?\s+.*$', '        minSdkVersion 23', app, 'minSdk')
          app = replace_line(r'^\s*targetSdk(?:Version)?\s+.*$', '        targetSdkVersion 35', app, 'targetSdk')
          app = re.sub(r'^\s*ndkVersion\s+.*$', '    ndkVersion "27.0.12077973"', app, count=1, flags=re.M)
          app = re.sub(r'^\s*versionCode\s+.*$', '        versionCode 1', app, count=1, flags=re.M)
          app = re.sub(r'^\s*versionName\s+.*$', '        versionName "1.0"', app, count=1, flags=re.M)
          app = re.sub(r'^\s*namespace\s+.*$', '    namespace "com.mycompany.ytmutual"', app, count=1, flags=re.M)
          app = re.sub(r'^\s*applicationId\s+.*$', '        applicationId "com.mycompany.ytmutual"', app, count=1, flags=re.M)

          app_plugin = '    id "com.google.gms.google-services"'
          if 'com.google.gms.google-services' not in app:
              app = app.replace('    id "com.android.application"', '    id "com.android.application"\n' + app_plugin, 1)

          settings = re.sub(r'id "com.android.application" version "[^"]+" apply false',
                            'id "com.android.application" version "8.3.2" apply false', settings, count=1)
          settings = re.sub(r'id "org.jetbrains.kotlin.android" version "[^"]+" apply false',
                            'id "org.jetbrains.kotlin.android" version "1.9.22" apply false', settings, count=1)
          if 'com.google.gms.google-services' not in settings:
              settings = settings.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false', 1)

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if wrapper.exists():
              data = wrapper.read_text()
              data = re.sub(r'distributionUrl=.*',
                            'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip',
                            data, count=1)
              wrapper.write_text(data)

          app_path.write_text(app)
          settings_path.write_text(settings)

          print("Configured Android Gradle files:")
          print(app_path.read_text())
          print(settings_path.read_text())
          PY

      - name: Verify Firebase configuration
        run: |
          test -f android/app/google-services.json
          grep -q '"package_name": "com.mycompany.ytmutual"' android/app/google-services.json

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yt-mutual-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
