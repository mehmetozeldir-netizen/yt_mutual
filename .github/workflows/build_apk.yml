name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Generate Android project and configure Firebase
        shell: bash
        run: |
          # Preserve Firebase config before regenerating Android scaffold.
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json "$RUNNER_TEMP/google-services.json"
          fi

          # The checked-in Android scaffold omits the binary Gradle wrapper JAR.
          # Regenerate the complete Flutter Android project in CI when it is absent.
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            rm -rf android
            flutter create . --platforms=android --org com.mycompany --project-name ytmutual
          fi

          # Restore Firebase config after Flutter recreates the Android directory.
          if [ -f "$RUNNER_TEMP/google-services.json" ]; then
            mkdir -p android/app
            cp "$RUNNER_TEMP/google-services.json" android/app/google-services.json
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          app_gradle = next((p for p in (
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ) if p.exists()), None)
          settings_gradle = next((p for p in (
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts"),
          ) if p.exists()), None)

          if app_gradle is None or settings_gradle is None:
              raise SystemExit("Android Gradle files were not generated.")

          app = app_gradle.read_text()
          settings = settings_gradle.read_text()
          kts = app_gradle.suffix == ".kts"

          # Firebase Auth requires Android API level 23 or newer.
          if kts:
              app = re.sub(r'minSdk\\s*=\\s*[^\\s]+', 'minSdk = 23', app, count=1)
          else:
              app = re.sub(r'minSdk(?:Version)?\\s+[^\\s]+', 'minSdk 23', app, count=1)

          if kts:
              app = re.sub(r'namespace\s*=\s*"[^"]+"',
                           'namespace = "com.mycompany.ytmutual"', app, count=1)
              app = re.sub(r'applicationId\s*=\s*"[^"]+"',
                           'applicationId = "com.mycompany.ytmutual"', app, count=1)
              app_plugin = 'id("com.google.gms.google-services")'
              android_plugin = 'id("com.android.application")'
              settings_plugin = 'id("com.google.gms.google-services") version "4.4.2" apply false'
          else:
              app = re.sub(r'namespace\s+[\'"][^\'"]+[\'"]',
                           'namespace "com.mycompany.ytmutual"', app, count=1)
              app = re.sub(r'applicationId\s+[\'"][^\'"]+[\'"]',
                           'applicationId "com.mycompany.ytmutual"', app, count=1)
              app_plugin = 'id "com.google.gms.google-services"'
              android_plugin = 'id "com.android.application"'
              settings_plugin = 'id "com.google.gms.google-services" version "4.4.2" apply false'

          if app_plugin not in app:
              if android_plugin not in app:
                  raise SystemExit("Android application plugin declaration not found.")
              app = app.replace(android_plugin, android_plugin + "\n    " + app_plugin, 1)

          if "com.google.gms.google-services" not in settings:
              match = re.search(r'plugins\s*\{', settings)
              if not match:
                  raise SystemExit("Gradle settings plugins block not found.")
              pos = match.end()
              settings = settings[:pos] + "\n    " + settings_plugin + settings[pos:]

          app_gradle.write_text(app)
          settings_gradle.write_text(settings)

          # Move MainActivity to the package directory expected by the app ID.
          roots = [
              Path("android/app/src/main/kotlin"),
              Path("android/app/src/main/java"),
          ]
          for root in roots:
              if root.exists():
                  for source in list(root.rglob("MainActivity.kt")) + list(root.rglob("MainActivity.java")):
                      target_dir = root / "com" / "mycompany" / "ytmutual"
                      target_dir.mkdir(parents=True, exist_ok=True)
                      target = target_dir / source.name
                      if source != target:
                          body = source.read_text()
                          body = re.sub(r'^package\s+[^;\n]+;?\s*$', 
                                        'package com.mycompany.ytmutual', body, count=1, flags=re.M)
                          source.unlink()
                          target.write_text(body)
          PY

          echo "Configured Android application ID:"
          grep -R 'applicationId' android/app/build.gradle*

      - name: Verify Firebase configuration
        shell: bash
        run: |
          test -f android/app/google-services.json || {
            echo "::error::Upload google-services.json to android/app/. The Firebase Android app package must be com.mycompany.ytmutual."
            exit 1
          }

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
